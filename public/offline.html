<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202426" />
    <title>Нет соединения — ЭвоТех</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f7; color: #202426; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #5b6166; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 20px; background: #0b3a63; color: #fff; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Нет соединения с интернетом</h1>
      <p>Кабинет ЭвоТех работает онлайн, чтобы статусы, сроки и документы были актуальными. Проверьте связь и обновите страницу.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </main>
  </body>
</html>
