# Боевой запуск на сервере (Timeweb Cloud). Каталог на сервере: /opt/evotech
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Секреты — только в /opt/evotech/.env (не в git).

name: evotech

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evotech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: evotech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evotech -d evotech"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется — база доступна только приложению

  # Разовый шаг перед запуском приложения: применение миграций БД
  migrate:
    image: evotech-worker:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://evotech:${POSTGRES_PASSWORD}@db:5432/evotech?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: ..
      target: app
      args:
        APP_URL: ${APP_URL}
    image: evotech-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://evotech:${POSTGRES_PASSWORD}@db:5432/evotech?schema=public
      STORAGE_DIR: /app/storage
    volumes:
      - files:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      target: worker
      args:
        APP_URL: ${APP_URL}
    image: evotech-worker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://evotech:${POSTGRES_PASSWORD}@db:5432/evotech?schema=public
      STORAGE_DIR: /app/storage
    volumes:
      - files:/app/storage
      - ../data:/app/data:ro

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
